name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The smallest example that shows the problem. Use invented data, never real conversations.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: citedesk version or commit
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and operating system
