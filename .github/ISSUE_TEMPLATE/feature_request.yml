name: Feature request
description: A use case citedesk does not cover.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and why citedesk does not let you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
